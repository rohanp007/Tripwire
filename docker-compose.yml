name: tripwire
services:
  # PostgreSQL Service
  postgres: 
    image: postgres:16
    container_name: postgres_db
    environment: 
      POSTGRES_USER: ${INGEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INGEST_POSTGRES_PASS}
      POSTGRES_DB: ${INGEST_POSTGRES_DB}
    ports:
      - "5433:5432" # Expose PostgreSQL on port 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes: 
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata: 
    